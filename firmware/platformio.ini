; PlatformIO build of the same ESP-IDF project (idf.py works too). Pick the board with -e.
;   pio run -e lcd_2_1 -t upload
;   pio run -e amoled_2_16 -t upload
; Needs PlatformIO Core 6.1.19: 6.2.0 pulls in a SCons this platform cannot import.
;   pipx install --force --python python3.12 platformio==6.1.19
;
; Apps are on by default; turn one off with e.g. CONFIG_DOT_APP_SPOTIFY=n in boards/<env>.defaults.

[platformio]
src_dir = main
default_envs = lcd_2_1

[env]
; pioarduino's platform ships a current ESP-IDF; the official one lags behind.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

[env:lcd_2_1]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/lcd_2_1.defaults

[env:amoled_2_16]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/amoled_2_16.defaults
