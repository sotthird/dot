[project]
name = "dot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "dotenv==0.9.9",
    "idna==3.18",
    "pip==25.1.1",
    "psutil==7.2.2",
    "pyserial==3.5",
    "python-dotenv==1.2.2",
    "redis==8.0.0",
    "requests==2.34.2",
    "spotipy==2.26.0",
    "urllib3==2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "managed_components",
    ".ruff_cache",
    ".cache",
    ".vscode",
    ".claude",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false          # flip to true when you're ready for full strict mode
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
