[project]
name = "dot-host"
version = "0.1.0"
description = "Desktop companion for the dot ESP32-S3 touch display"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
cpu = ["psutil>=5.9"]
spotify = ["spotipy>=2.24", "python-dotenv>=1.0", "pillow>=10.0", "requests>=2.31"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "types-requests", "types-psutil"]

[project.scripts]
dot-host = "dot_host.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dot_host"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
