name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff clang-format
      - name: Ruff lint
        run: ruff check host
      - name: Ruff format check
        run: ruff format --check host
      - name: clang-format check
        run: find firmware \( -name "*.c" -o -name "*.h" \) | xargs clang-format --dry-run --Werror

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "host[cpu,spotify,dev]"
      - name: mypy
        run: mypy host/dot_host host/scripts

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "host[cpu,spotify]" detect-secrets pip-audit
      - name: Secret scan
        run: detect-secrets scan --baseline .secrets.baseline
      - name: Dependency vulnerability scan
        run: pip-audit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "host[cpu,spotify,dev]"
      - name: pytest
        working-directory: host
        run: pytest -q
